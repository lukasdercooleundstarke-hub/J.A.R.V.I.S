<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#030711">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>J.A.R.V.I.S 5.0</title>

<style>
:root {
    --bg: #030711;
    --panel: rgba(6, 16, 30, .88);
    --cyan: #62dcff;
    --cyan2: #149ddd;
    --text: #e9faff;
    --muted: #7893a5;
    --green: #64f0aa;
    --red: #ff6478;
    --line: rgba(98,220,255,.22);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at center,
            #09233c 0%,
            #030711 48%,
            #010309 100%
        );
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(98,220,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(98,220,255,.025) 1px,
            transparent 1px
        );

    background-size: 42px 42px;
    mask-image:
        radial-gradient(
            circle,
            black 0%,
            transparent 75%
        );

    pointer-events: none;
}

/* HEADER */

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background: rgba(2,7,14,.65);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid var(--line);

    z-index: 20;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 15px;
    font-weight: 800;
    letter-spacing: .2em;
}

.logoDot {
    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 10px var(--cyan),
        0 0 25px var(--cyan);
}

.systemStatus {
    display: flex;
    align-items: center;
    gap: 8px;

    font-size: 11px;
    color: var(--muted);

    letter-spacing: .12em;
}

.statusDot {
    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: #777;
}

.systemStatus.online .statusDot {
    background: var(--green);
    box-shadow: 0 0 14px var(--green);
}

.systemStatus.error .statusDot {
    background: var(--red);
    box-shadow: 0 0 14px var(--red);
}

/* MAIN */

main {
    width: 100%;
    height: 100%;

    position: relative;
}

/* CORE */

#core {
    position: absolute;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    width: min(64vw, 350px);
    height: min(64vw, 350px);

    display: grid;
    place-items: center;
}

.orbit {
    position: absolute;
    inset: 0;

    border-radius: 50%;

    border:
        1px solid
        rgba(98,220,255,.20);

    animation:
        rotate 18s linear infinite;
}

.orbit::after {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    top: -4px;
    left: 50%;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 10px var(--cyan),
        0 0 30px var(--cyan);
}

.orbit2 {
    inset: 13%;

    border-style: dashed;

    animation-duration: 11s;
    animation-direction: reverse;
}

.orbit3 {
    inset: 27%;

    opacity: .55;

    animation-duration: 7s;
}

.coreGlow {
    position: absolute;

    inset: 25%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #c9f7ff 0%,
            #37b9ea 18%,
            rgba(30,137,190,.4) 45%,
            transparent 72%
        );

    filter: blur(7px);

    animation:
        pulse 2.5s ease-in-out infinite;
}

.core {
    position: relative;

    width: 38%;
    height: 38%;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background:
        radial-gradient(
            circle at 35% 25%,
            #eaffff,
            #56c9ef 22%,
            #0874a7 48%,
            #021725 78%
        );

    border:
        1px solid
        rgba(210,250,255,.85);

    box-shadow:
        0 0 25px rgba(98,220,255,.8),
        0 0 70px rgba(20,157,221,.45),
        inset 0 0 35px rgba(255,255,255,.25);

    font-size: 25px;
    font-weight: 900;

    letter-spacing: .15em;

    transition: .3s;
}

.core::after {
    content: "";

    position: absolute;
    inset: 10%;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.25);
}

body.listening .core {
    box-shadow:
        0 0 35px var(--green),
        0 0 90px rgba(100,240,170,.45);
}

body.listening .coreGlow {
    background:
        radial-gradient(
            circle,
            #eafff5,
            #64f0aa 25%,
            transparent 72%
        );
}

body.thinking .orbit {
    animation-duration: 2s;
}

body.speaking .core {
    box-shadow:
        0 0 40px var(--cyan),
        0 0 100px rgba(98,220,255,.55);
}

/* STATE */

#state {
    position: absolute;

    top: calc(
        47% + min(33vw, 175px)
    );

    left: 0;
    right: 0;

    text-align: center;

    font-size: 11px;

    color: var(--muted);

    letter-spacing: .25em;
}

#response {
    position: absolute;

    left: 50%;
    bottom: 105px;

    transform: translateX(-50%);

    width: min(760px, 88vw);

    text-align: center;

    font-size: 17px;
    line-height: 1.5;

    color: var(--text);

    text-shadow:
        0 0 18px
        rgba(98,220,255,.18);
}

/* CONTROLS */

.controls {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    width: min(800px, 94vw);

    display: flex;
    gap: 8px;
}

#commandInput {
    flex: 1;

    min-width: 0;

    height: 50px;

    padding: 0 16px;

    color: var(--text);

    background:
        rgba(3,10,18,.9);

    border:
        1px solid
        var(--line);

    border-radius: 16px;

    outline: none;
}

#commandInput:focus {
    border-color:
        rgba(98,220,255,.7);

    box-shadow:
        0 0 0 3px
        rgba(98,220,255,.06);
}

.controlButton {
    width: 50px;
    height: 50px;

    border-radius: 16px;

    color: var(--text);

    background:
        rgba(8,22,38,.85);

    border:
        1px solid
        var(--line);

    font-size: 19px;
}

/* PANEL */

#panel {
    position: fixed;

    right: 12px;
    top: 76px;

    width: min(390px, 92vw);

    max-height:
        calc(100vh - 90px);

    overflow-y: auto;

    padding: 14px;

    background:
        rgba(3,9,17,.96);

    border:
        1px solid
        var(--line);

    border-radius: 20px;

    backdrop-filter:
        blur(22px);

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.55);

    display: none;

    z-index: 50;
}

#panel.open {
    display: block;
}

.panelHeader {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 12px;

    font-weight: 800;

    letter-spacing: .1em;
}

.panelCard {
    padding: 13px;

    margin: 9px 0;

    border-radius: 15px;

    background:
        rgba(10,22,37,.65);

    border:
        1px solid
        var(--line);
}

.panelTitle {
    font-size: 12px;

    font-weight: 800;

    letter-spacing: .08em;
}

.panelText {
    margin-top: 6px;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.5;
}

.panelButtons {
    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 10px;
}

.panelButton {
    padding: 9px 11px;

    border-radius: 11px;

    background:
        rgba(9,28,46,.8);

    border:
        1px solid
        var(--line);

    color: var(--text);

    font-size: 12px;
}

#diagnostics {
    margin-top: 10px;

    max-height: 180px;

    overflow: auto;

    white-space: pre-wrap;

    font-family:
        ui-monospace,
        monospace;

    font-size: 10px;

    color: #9fc0cf;
}

/* TOAST */

#toast {
    position: fixed;

    top: 78px;
    left: 50%;

    transform:
        translateX(-50%)
        translateY(-10px);

    padding: 10px 14px;

    border-radius: 12px;

    background:
        #071522;

    border:
        1px solid
        var(--line);

    color: var(--text);

    opacity: 0;

    pointer-events: none;

    transition: .25s;

    z-index: 100;

    font-size: 12px;
}

#toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* ANIMATIONS */

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.13);
    }
}

/* MOBILE */

@media(max-width:600px) {

    header {
        height: 56px;
        padding: 0 14px;
    }

    .logo {
        font-size: 12px;
    }

    #response {
        bottom: 84px;
        font-size: 15px;
    }

    .controls {
        bottom: 10px;
    }

    .controlButton {
        width: 46px;
        height: 46px;
    }

    #commandInput {
        height: 46px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        <span class="logoDot"></span>
        J.A.R.V.I.S
        <span style="color:#7893a5">5.0</span>
    </div>

    <div id="systemStatus"
         class="systemStatus">

        <span class="statusDot"></span>

        <span id="statusText">
            STARTING
        </span>

    </div>

</header>


<main>

    <div id="core">

        <div class="orbit"></div>
        <div class="orbit orbit2"></div>
        <div class="orbit orbit3"></div>

        <div class="coreGlow"></div>

        <div class="core">
            J
        </div>

    </div>


    <div id="state">
        CORE STARTING
    </div>


    <div id="response">
        JARVIS 5.0 wird initialisiert …
    </div>


    <div class="controls">

        <button
            id="micButton"
            class="controlButton">
            🎙️
        </button>

        <input
            id="commandInput"
            placeholder="Befehl an JARVIS …"
            autocomplete="off">

        <button
            id="sendButton"
            class="controlButton">
            ➤
        </button>

        <button
            id="menuButton"
            class="controlButton">
            ☰
        </button>

    </div>

</main>


<div id="panel">

    <div class="panelHeader">

        JARVIS SYSTEM

        <button
            id="closePanel"
            class="panelButton">
            ✕
        </button>

    </div>


    <div class="panelCard">

        <div class="panelTitle">
            🧠 KI-KERN
        </div>

        <div
            id="aiInfo"
            class="panelText">
            Prüfe WebGPU …
        </div>

        <div class="panelButtons">

            <button
                id="loadAI"
                class="panelButton">
                KI laden
            </button>

            <button
                id="clearCache"
                class="panelButton">
                Cache löschen
            </button>

        </div>

    </div>


    <div class="panelCard">

        <div class="panelTitle">
            💾 MEMORY
        </div>

        <div
            id="memoryInfo"
            class="panelText">
        </div>

        <div class="panelButtons">

            <button
                id="showMemory"
                class="panelButton">
                Gedächtnis
            </button>

            <button
                id="clearMemory"
                class="panelButton">
                Löschen
            </button>

        </div>

    </div>


    <div class="panelCard">

        <div class="panelTitle">
            ⚙️ TOOLS
        </div>

        <div class="panelButtons">

            <button
                data-command="uhrzeit"
                class="panelButton">
                Uhrzeit
            </button>

            <button
                data-command="datum"
                class="panelButton">
                Datum
            </button>

            <button
                data-command="system"
                class="panelButton">
                System
            </button>

            <button
                data-command="timer 60"
                class="panelButton">
                Timer 60s
            </button>

            <button
                data-command="notiz"
                class="panelButton">
                Notiz
            </button>

        </div>

    </div>


    <div class="panelCard">

        <div class="panelTitle">
            🎨 DESIGN
        </div>

        <div class="panelButtons">

            <button
                id="toggleGlow"
                class="panelButton">
                Glow
            </button>

            <button
                id="resetDesign"
                class="panelButton">
                Reset
            </button>

        </div>

    </div>


    <div class="panelCard">

        <div class="panelTitle">
            👨‍💻 DEVELOPER
        </div>

        <div class="panelButtons">

            <button
                id="diagnoseButton"
                class="panelButton">
                Diagnose
            </button>

            <button
                id="exportButton"
                class="panelButton">
                Export
            </button>

        </div>

        <div id="diagnostics"></div>

    </div>

</div>


<div id="toast"></div>


<script type="module">

/*
==========================================================
 J.A.R.V.I.S 5.0
 Local browser AI
 WebLLM + WebGPU
==========================================================
*/

import {
    CreateMLCEngine
} from
"https://esm.run/@mlc-ai/web-llm";


/* =======================================================
   CONFIG
======================================================= */

const APP_KEY =
    "JARVIS_5_MEMORY";

const SETTINGS_KEY =
    "JARVIS_5_SETTINGS";

const SHORT_KEY =
    "JARVIS_5_SHORT_MEMORY";


/*
   Bewusst kleines Modell für bessere
   iPad-Kompatibilität.

   Wenn dein iPad ein größeres Modell
   problemlos schafft, können wir später
   auf ein größeres Modell wechseln.
*/

const MODEL =
    "Llama-3.2-1B-Instruct-q4f32_1-MLC";


/* =======================================================
   STATE
======================================================= */

let engine = null;

let loadingAI = false;

let recognizing = false;

let memory =
    JSON.parse(
        localStorage.getItem(APP_KEY)
        || "[]"
    );

let shortMemory =
    JSON.parse(
        localStorage.getItem(SHORT_KEY)
        || "[]"
    );

let settings =
    JSON.parse(
        localStorage.getItem(SETTINGS_KEY)
        ||
        '{"glow":true,"voice":true}'
    );

let logs = [];


/* =======================================================
   DOM
======================================================= */

const $ = id =>
    document.getElementById(id);


/* =======================================================
   STORAGE
======================================================= */

function saveData() {

    localStorage.setItem(
        APP_KEY,
        JSON.stringify(
            memory.slice(-100)
        )
    );

    localStorage.setItem(
        SHORT_KEY,
        JSON.stringify(
            shortMemory.slice(-12)
        )
    );

    localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(settings)
    );

}


/* =======================================================
   DIAGNOSTICS
======================================================= */

function log(message) {

    const line =
        new Date().toLocaleTimeString(
            "de-DE"
        )
        + "  "
        + message;

    logs.push(line);

    logs =
        logs.slice(-100);

    console.log(
        "[JARVIS]",
        message
    );

    $("diagnostics").textContent =
        logs.join("\n");
}


/* =======================================================
   UI
======================================================= */

function setStatus(
    text,
    online = false,
    error = false
) {

    const el =
        $("systemStatus");

    el.className =
        "systemStatus"
        + (online ? " online" : "")
        + (error ? " error" : "");

    $("statusText").textContent =
        text;
}


function setState(text) {

    $("state").textContent =
        text;
}


function response(text) {

    $("response").textContent =
        text;
}


function toast(text) {

    const el =
        $("toast");

    el.textContent =
        text;

    el.classList.add("show");

    setTimeout(
        () =>
            el.classList.remove("show"),
        2400
    );
}


/* =======================================================
   VOICE OUTPUT
======================================================= */

function speak(text) {

    if (!settings.voice)
        return;

    if (!("speechSynthesis" in window))
        return;

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        "de-DE";

    utterance.rate =
        .95;

    utterance.pitch =
        1;

    document.body.classList.add(
        "speaking"
    );

    utterance.onend =
        () =>
            document.body.classList.remove(
                "speaking"
            );

    speechSynthesis.speak(
        utterance
    );
}


/* =======================================================
   MEMORY
======================================================= */

function updateMemoryUI() {

    $("memoryInfo").textContent =
        memory.length
        + " Erinnerungen gespeichert."
        + " Lokal auf diesem Gerät.";
}


function remember(text) {

    memory.push({

        text,

        timestamp:
            new Date().toISOString()

    });

    saveData();

    updateMemoryUI();

    log(
        "Memory gespeichert."
    );
}


function forget(text) {

    const before =
        memory.length;

    memory =
        memory.filter(
            item =>
                !item.text
                    .toLowerCase()
                    .includes(
                        text.toLowerCase()
                    )
        );

    saveData();

    updateMemoryUI();

    return before -
        memory.length;
}


/* =======================================================
   SYSTEM PROMPT
======================================================= */

function systemPrompt() {

    const memories =
        memory
            .slice(-20)
            .map(
                item =>
                    item.text
            )
            .join(" | ");

    return `

Du bist JARVIS 5.0.

Du bist ein persönlicher KI-Assistent.

Antworte auf Deutsch.

Sei hilfreich, intelligent und präzise.

Behaupte niemals, dass du eine Aktion
ausgeführt hast, wenn die Webseite sie
nicht tatsächlich ausgeführt hat.

Du hast keinen automatischen Zugriff auf
das Internet, andere Apps, Dateien oder
Gerätefunktionen.

Lokales Langzeitgedächtnis:

${memories || "Noch keine Erinnerungen."}

`;
}


/* =======================================================
   WEBGPU CHECK
======================================================= */

async function checkWebGPU() {

    try {

        if (!navigator.gpu) {

            $("aiInfo").textContent =
                "❌ WebGPU ist nicht verfügbar.";

            log(
                "WebGPU nicht verfügbar."
            );

            return false;
        }


        const adapter =
            await navigator.gpu
                .requestAdapter();


        if (!adapter) {

            $("aiInfo").textContent =
                "❌ Kein GPU-Adapter.";

            log(
                "Kein GPU-Adapter."
            );

            return false;
        }


        const info =
            adapter.info || {};


        $("aiInfo").textContent =
            "✓ WebGPU verfügbar"
            + " • "
            + (
                info.vendor
                || "GPU"
            );


        log(
            "WebGPU OK."
        );


        return true;

    } catch(error) {

        $("aiInfo").textContent =
            "❌ WebGPU Fehler.";

        log(
            "WebGPU Fehler: "
            + error.message
        );

        return false;
    }

}


/* =======================================================
   AI LOADING
======================================================= */

async function loadAI() {

    if (
        engine
        ||
        loadingAI
    )
        return;


    loadingAI = true;

    $("loadAI").disabled =
        true;


    setStatus(
        "KI WIRD GELADEN"
    );

    setState(
        "AI CORE INITIALIZING"
    );

    response(
        "Lokales KI-Gehirn wird geladen …"
    );


    try {

        const gpu =
            await checkWebGPU();


        if (!gpu) {

            throw new Error(
                "WebGPU nicht verfügbar."
            );

        }


        log(
            "Starte WebLLM."
        );


        engine =
            await CreateMLCEngine(
                MODEL,
                {

                    initProgressCallback:
                        progress => {

                            const text =
                                progress?.text
                                ||
                                "Modell wird geladen …";


                            response(
                                text
                            );

                            setState(
                                text.substring(
                                    0,
                                    30
                                )
                            );

                            log(
                                text
                            );

                        }

                }
            );


        setStatus(
            "LOCAL AI ONLINE",
            true
        );

        setState(
            "CORE ONLINE"
        );

        response(
            "Lokales KI-Gehirn ist online."
        );

        log(
            "KI erfolgreich geladen."
        );

        toast(
            "KI ist online."
        );


    } catch(error) {

        engine = null;


        setStatus(
            "KI FEHLER",
            false,
            true
        );

        setState(
            "CORE DIAGNOSTIC"
        );

        response(
            "Die lokale KI konnte nicht geladen werden."
        );


        log(
            "KI FEHLER:"
            + (
                error?.stack
                ||
                error?.message
                ||
                error
            )
        );


        toast(
            "KI-Fehler. Diagnose geöffnet."
        );


        $("panel")
            .classList.add(
                "open"
            );


    } finally {

        loadingAI = false;

        $("loadAI").disabled =
            false;

    }

}


/* =======================================================
   AI CHAT
======================================================= */

async function askAI(text) {

    if (!engine)
        return null;


    document.body.classList.add(
        "thinking"
    );


    setState(
        "THINKING"
    );


    try {

        const messages = [

            {
                role:
                    "system",

                content:
                    systemPrompt()
            },

            ...shortMemory,

            {
                role:
                    "user",

                content:
                    text
            }

        ];


        const result =
            await engine
                .chat
                .completions
                .create({

                    messages,

                    temperature:
                        .65,

                    max_tokens:
                        300

                });


        const answer =
            result
                ?.choices
                ?. [0]
                ?.message
                ?.content
                ?.trim();


        if (!answer)
            return "Ich habe keine Antwort erhalten.";


        shortMemory.push({

            role:
                "user",

            content:
                text

        });


        shortMemory.push({

            role:
                "assistant",

            content:
                answer

        });


        saveData();


        return answer;


    } catch(error) {

        log(
            "AI Antwortfehler: "
            + error.message
        );

        return null;


    } finally {

        document.body.classList.remove(
            "thinking"
        );

        setState(
            "CORE ONLINE"
        );

    }

}


/* =======================================================
   LOCAL COMMANDS
======================================================= */

function localCommand(command) {

    const q =
        command
            .trim()
            .toLowerCase();


    /* MEMORY */

    if (
        q.startsWith(
            "merke dir "
        )
        ||
        q.startsWith(
            "merk dir "
        )
    ) {

        const text =
            command.replace(
                /^merk(e)? dir /i,
                ""
            ).trim();


        if (!text)
            return "Was soll ich mir merken?";


        remember(text);


        return "Verstanden. Ich habe es gespeichert.";

    }


    /* FORGET */

    if (
        q.startsWith(
            "vergiss "
        )
    ) {

        const text =
            command
                .replace(
                    /^vergiss /i,
                    ""
                )
                .trim();


        const removed =
            forget(text);


        if (removed)
            return "Erledigt. Die passende Erinnerung wurde gelöscht.";


        return "Dazu habe ich keine Erinnerung gefunden.";

    }


    /* TIME */

    if (
        q === "uhrzeit"
        ||
        q.includes(
            "wie spät"
        )
    ) {

        return (
            "Es ist "
            +
            new Date()
                .toLocaleTimeString(
                    "de-DE",
                    {
                        hour:
                            "2-digit",
                        minute:
                            "2-digit"
                    }
                )
            +
            " Uhr."
        );

    }


    /* DATE */

    if (
        q === "datum"
        ||
        q.includes(
            "welcher tag"
        )
    ) {

        return (
            "Heute ist "
            +
            new Date()
                .toLocaleDateString(
                    "de-DE",
                    {
                        weekday:
                            "long",
                        day:
                            "2-digit",
                        month:
                            "long",
                        year:
                            "numeric"
                    }
                )
            +
            "."
        );

    }


    /* SYSTEM */

    if (
        q === "system"
        ||
        q === "systemstatus"
    ) {

        return (
            "JARVIS 5.0. "
            +
            "WebGPU: "
            +
            (
                navigator.gpu
                    ? "verfügbar"
                    : "nicht verfügbar"
            )
            +
            ". Memory: "
            +
            memory.length
            +
            " Einträge."
        );

    }


    /* MEMORY LIST */

    if (
        q === "gedächtnis"
        ||
        q === "memory"
    ) {

        if (!memory.length)
            return "Mein Gedächtnis ist derzeit leer.";


        return memory
            .slice(-8)
            .map(
                (item,index) =>
                    (
                        index + 1
                    )
                    +
                    ". "
                    +
                    item.text
            )
            .join("\n");

    }


    /* TIMER */

    if (
        q.startsWith(
            "timer"
        )
    ) {

        const parts =
            q.split(
                /\s+/
            );


        let seconds =
            Number(
                parts[1]
            );


        if (
            !Number.isFinite(
                seconds
            )
        )
            seconds = 60;


        seconds =
            Math.max(
                1,
                Math.floor(
                    seconds
                )
            );


        setTimeout(
            () => {

                response(
                    "Timer beendet."
                );

                speak(
                    "Timer beendet."
                );

                toast(
                    "Timer beendet."
                );

            },
            seconds * 1000
        );


        return (
            "Timer für "
            +
            seconds
            +
            " Sekunden gestartet."
        );

    }


    /* NOTE */

    if (
        q === "notiz"
    ) {

        const note =
            prompt(
                "Was soll ich speichern?"
            );


        if (!note)
            return "Keine Notiz gespeichert.";


        remember(
            "Notiz: "
            +
            note
        );


        return "Notiz gespeichert.";

    }


    /* DIAGNOSTICS */

    if (
        q === "diagnose"
    ) {

        $("panel")
            .classList.add(
                "open"
            );


        checkWebGPU();


        return "Diagnose geöffnet.";

    }


    return null;

}


/* =======================================================
   COMMAND PROCESSOR
======================================================= */

async function processCommand(
    command
) {

    command =
        command.trim();


    if (!command)
        return;


    response(
        "Verarbeitung …"
    );


    setState(
        "PROCESSING"
    );


    /* Local command first */

    const local =
        localCommand(
            command
        );


    if (local) {

        response(
            local
        );

        speak(
            local
        );

        setState(
            "CORE ONLINE"
        );

        return;

    }


    /* AI */

    if (!engine) {

        const message =
            "Mein lokales KI-Gehirn ist noch nicht verfügbar. Öffne das Systemmenü und starte die KI.";

        response(
            message
        );

        speak(
            message
        );

        setState(
            "AI OFFLINE"
        );

        return;

    }


    const answer =
        await askAI(
            command
        );


    if (!answer) {

        const message =
            "Ich konnte die Anfrage nicht verarbeiten. Öffne die Diagnose im Systemmenü.";

        response(
            message
        );

        speak(
            message
        );

        return;

    }


    response(
        answer
    );

    speak(
        answer
    );

}


/* =======================================================
   TEXT INPUT
======================================================= */

$("sendButton").onclick =
    () => {

        const input =
            $("commandInput");

        const text =
            input.value;

        input.value =
            "";

        processCommand(
            text
        );

    };


$("commandInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key ===
                "Enter"
            ) {

                $("sendButton")
                    .click();

            }

        }
    );


/* =======================================================
   VOICE INPUT
======================================================= */

$("micButton").onclick =
    () => {

        const SpeechRecognition =
            window.SpeechRecognition
            ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            toast(
                "Spracherkennung ist in diesem Browser nicht verfügbar."
            );

            return;

        }


        if (recognizing)
            return;


        const recognition =
            new SpeechRecognition();


        recognition.lang =
            "de-DE";

        recognition.interimResults =
            false;

        recognition.maxAlternatives =
            1;


        recognizing =
            true;


        document.body.classList.add(
            "listening"
        );


        setState(
            "LISTENING"
        );


        response(
            "Ich höre zu …"
        );


        recognition.onresult =
            event => {

                const text =
                    event
                        .results
                        [0]
                        [0]
                        .transcript;


                $("commandInput")
                    .value =
                    text;


                $("sendButton")
                    .click();

            };


        recognition.onerror =
            event => {

                log(
                    "Mikrofonfehler: "
                    +
                    event.error
                );

                toast(
                    "Mikrofon: "
                    +
                    event.error
                );

            };


        recognition.onend =
            () => {

                recognizing =
                    false;


                document.body.classList.remove(
                    "listening"
                );


                setState(
                    "CORE ONLINE"
                );

            };


        recognition.start();

    };


/* =======================================================
   PANEL
======================================================= */

$("menuButton").onclick =
    () => {

        $("panel")
            .classList.toggle(
                "open"
            );

    };


$("closePanel").onclick =
    () => {

        $("panel")
            .classList.remove(
                "open"
            );

    };


/* =======================================================
   AI BUTTON
======================================================= */

$("loadAI").onclick =
    loadAI;


/* =======================================================
   MEMORY BUTTONS
======================================================= */

$("showMemory").onclick =
    () => {

        if (!memory.length) {

            response(
                "Mein Gedächtnis ist leer."
            );

        } else {

            response(
                memory
                    .slice(-8)
                    .map(
                        item =>
                            item.text
                    )
                    .join(" • ")
            );

        }

        $("panel")
            .classList.remove(
                "open"
            );

    };


$("clearMemory").onclick =
    () => {

        if (
            confirm(
                "Das komplette lokale JARVIS-Gedächtnis löschen?"
            )
        ) {

            memory = [];

            shortMemory = [];

            saveData();

            updateMemoryUI();

            toast(
                "Gedächtnis gelöscht."
            );

        }

    };


/* =======================================================
   CACHE
======================================================= */

$("clearCache").onclick =
    async () => {

        try {

            if (
                "caches"
                in window
            ) {

                const keys =
                    await caches.keys();


                await Promise.all(
                    keys.map(
                        key =>
                            caches.delete(
                                key
                            )
                    )
                );

            }


            toast(
                "Browser-Cache gelöscht. Seite neu laden."
            );


            log(
                "Cache gelöscht."
            );


        } catch(error) {

            log(
                "Cache Fehler: "
                +
                error.message
            );

            toast(
                "Cache konnte nicht vollständig gelöscht werden."
            );

        }

    };


/* =======================================================
   DESIGN
======================================================= */

$("toggleGlow").onclick =
    () => {

        settings.glow =
            !settings.glow;


        if (
            settings.glow
        ) {

            document.body.style.filter =
                "";

        } else {

            document.body.style.filter =
                "saturate(.55)";

        }


        saveData();

    };


$("resetDesign").onclick =
    () => {

        settings.glow =
            true;

        document.body.style.filter =
            "";

        saveData();

        toast(
            "Design zurückgesetzt."
        );

    };


/* =======================================================
   TOOLS
======================================================= */

document
    .querySelectorAll(
        "[data-command]"
    )
    .forEach(
        button => {

            button.onclick =
                () => {

                    processCommand(
                        button.dataset.command
                    );

                };

        }
    );


/* =======================================================
   DIAGNOSTICS
======================================================= */

$("diagnoseButton").onclick =
    async () => {

        await checkWebGPU();

        log(
            "Browser: "
            +
            navigator.userAgent
        );

        log(
            "Online: "
            +
            navigator.onLine
        );

        log(
            "Platform: "
            +
            navigator.platform
        );

        log(
            "AI Engine: "
            +
            (
                engine
                    ? "ONLINE"
                    : "OFFLINE"
            )
        );

        toast(
            "Diagnose aktualisiert."
        );

    };


/* =======================================================
   EXPORT
======================================================= */

$("exportButton").onclick =
    () => {

        const html =
            "<!DOCTYPE html>\n"
            +
            document.documentElement
                .outerHTML;


        const blob =
            new Blob(
                [html],
                {
                    type:
                        "text/html"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;

        link.download =
            "index.html";


        link.click();


        setTimeout(
            () =>
                URL.revokeObjectURL(
                    url
                ),
            1000
        );


        toast(
            "JARVIS exportiert."
        );

    };


/* =======================================================
   ERROR MONITOR
======================================================= */

window.addEventListener(
    "error",
    event => {

        log(
            "JavaScript Fehler: "
            +
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    event => {

        log(
            "Promise Fehler: "
            +
            event.reason
        );

    }
);


/* =======================================================
   STARTUP
======================================================= */

updateMemoryUI();

setStatus(
    "SYSTEM READY",
    true
);

setState(
    "CORE ONLINE"
);

response(
    "JARVIS 5.0 bereit."
);

log(
    "JARVIS 5.0 gestartet."
);


/*
   WebGPU zuerst prüfen.
   KI danach automatisch laden.
*/

checkWebGPU()
    .then(
        () => {

            setTimeout(
                loadAI,
                700
            );

        }
    );

</script>
